kind: HelmRelease
metadata:
  name: istio-base
  namespace: platform-istio
spec:
  interval: 10m
  chart:
    spec:
      chart: base
      version: 1.28.3
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: platform-istio
  values:
    global:
      istioNamespace: platform-istio